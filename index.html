<body>


<div class="game">


<header>

<h1>

</h1>


<div class="info">

<span>
⭐ Ball:
<b id="score">0</b>
</span>


<span>
❤️ Jon:
<b id="life">3</b>
</span>


<span>
🏆 Rekord:
<b id="best">0</b>
</span>



<button id="restart">
🔄
</button>


</div>


</header>






<canvas id="canvas"></canvas>





<div class="controls">

<button id="left">
⬅️
</button>


<button id="right">
➡️
</button>


</div>






<div id="gameOver">

<h2>
O‘yin tugadi 😢
</h2>

<p>
Natija:
<span id="finalScore">
0
</span>
</p>


<button id="again">
Qayta o‘ynash
</button>


</div>






<footer>

Developer:
<b>
Ulug'bek.R
</b>

</footer>



</div>
